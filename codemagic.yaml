workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Fix old GeneratedPluginRegistrant
        script: |
          echo "Deleting old incompatible Java files"
          rm -rf android/app/src/main/java/io/flutter/plugins/
          flutter clean
          flutter pub get
      - name: Build AAB and APK
        script: |
          flutter build appbundle --release
          flutter build apk --release --split-per-abi
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
