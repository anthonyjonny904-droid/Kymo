workflows:
  android-build:
    name: Kymo Android Build
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Fix error
        script: |
          rm -rf android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          flutter clean
          flutter pub get
      - name: Build AAB and APK
        script: |
          flutter build appbundle --release
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
